<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>C0photocraft</title>
  <link data-trunk rel="rust" href="../../apps/photocraft-web/Cargo.toml" data-bin="photocraft-web" data-cargo-profile="wasm-release" data-cargo-features="heif,page-control" data-wasm-opt="z" data-weak-refs />
  <style>
    /* Transparent until the app paints: the host's own themed loading state shows through. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #photocraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #photocraft_loading { display: none; }
  </style>
  <script>
    // C0VIBE's host calls window.__c0hostRequest (src/shared/sow/guestView.ts in C0X); PhotoCraft's
    // page-control feature defines window.__photocraftControl once the app runs. Until then this is
    // undefined, which the host reads as "not ready yet".
    Object.defineProperty(window, '__c0hostRequest', { get: () => window.__photocraftControl });

    // Ctrl + Alt + wheel is PhotoCraft's zoom, the same gesture as Alt + wheel (wheel_nav::alt_gesture).
    // When the keys went to C0VIBE's window (a host menu or the AI bar had the focus), the page never saw
    // Ctrl go down. eframe then reads Ctrl on the wheel event as a trackpad pinch and zooms by
    // e^(0.01 x deltaY): 2.7x for one 100-pixel notch. Pass the notch on as Alt + wheel instead, which
    // zooms one step. With Shift held it is left alone: PhotoCraft leaves Ctrl + Alt + Shift undecided.
    window.addEventListener('wheel', (event) => {
      if (!event.isTrusted || !event.ctrlKey || !event.altKey || event.shiftKey || event.metaKey) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      event.target.dispatchEvent(new WheelEvent('wheel', {
        deltaX: event.deltaX, deltaY: event.deltaY, deltaZ: event.deltaZ, deltaMode: event.deltaMode,
        clientX: event.clientX, clientY: event.clientY, screenX: event.screenX, screenY: event.screenY,
        buttons: event.buttons, altKey: true, ctrlKey: false, shiftKey: false, metaKey: false,
        bubbles: true, cancelable: true, composed: true,
      }));
    }, { capture: true, passive: false });
  </script>
</head>
<body>
  <canvas id="photocraft_canvas"></canvas>
  <div id="photocraft_loading"></div>
</body>
</html>
